name: self-check

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the development tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Audit the development tools
        run: |
          pip-audit --strict --require-hashes --disable-pip -r requirements-dev.txt

      - name: Audit the workflows and the Dependabot configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --format github .
